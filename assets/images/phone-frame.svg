<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="420" height="840" aria-hidden="true" focusable="false">
	<defs>
		<!-- The rail is only a shade off the section background, so the device
		     reads as an edge around the picture rather than a dark cut-out. -->
		<linearGradient id="bk-phone-rim" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset=".05" stop-color="#eceef1"/>
			<stop offset=".5" stop-color="#e6e9ec"/>
			<stop offset=".95" stop-color="#eceef1"/>
			<stop offset="1" stop-color="#ffffff"/>
		</linearGradient>
		<linearGradient id="bk-phone-body" x1="0" y1="0" x2=".85" y2="1">
			<stop offset="0" stop-color="#f7f8f9"/>
			<stop offset=".5" stop-color="#f1f2f4"/>
			<stop offset="1" stop-color="#eaecef"/>
		</linearGradient>
	</defs>

	<!--
	There is deliberately no drop shadow in here. An SVG filter is clipped by
	this viewBox, and a soft shadow needs far more room than the margin around
	the body, so it ended in a straight line across the background. The shadow
	is a CSS filter on the <img> instead, where nothing clips it.
	-->

	<!-- Side controls, drawn first so the body edge laps over their inner half. -->
	<g fill="#e2e5e9">
		<rect x="9" y="196" width="8" height="36" rx="4"/>
		<rect x="9" y="256" width="8" height="64" rx="4"/>
		<rect x="9" y="336" width="8" height="64" rx="4"/>
		<rect x="403" y="272" width="8" height="96" rx="4"/>
	</g>

	<rect x="15" y="20" width="390" height="800" rx="56" fill="url(#bk-phone-rim)"/>
	<rect x="18.5" y="23.5" width="383" height="793" rx="52.5" fill="url(#bk-phone-body)"/>
	<rect x="15.5" y="20.5" width="389" height="799" rx="55.5" fill="none" stroke="rgba(20,24,30,.07)" stroke-width="1"/>

	<!-- Screen well. The section's own picture is laid over this by CSS; the
	     colour only shows if no picture has been set. -->
	<rect x="25" y="30" width="370" height="780" rx="46" fill="#0b0d10"/>
</svg>
